services:
  nginx:
    image: nginx:1.25-alpine
    container_name: speakright-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

  api-1: &api-service
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - apidata:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - INSTANCE_ID=api-1
      - IS_CRON_LEADER=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-speak-right-2026-super-secret-jwt-key}
      - FRONTEND_URL=${FRONTEND_URL:-https://tadat123.github.io/SpeakEnglishChallenge}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Speak Right Challenge 2026 <no-reply@speakright2026.com>}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  api-2:
    <<: *api-service
    environment:
      - NODE_ENV=production
      - PORT=4000
      - INSTANCE_ID=api-2
      - IS_CRON_LEADER=false
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-speak-right-2026-super-secret-jwt-key}
      - FRONTEND_URL=${FRONTEND_URL:-https://tadat123.github.io/SpeakEnglishChallenge}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Speak Right Challenge 2026 <no-reply@speakright2026.com>}

  api-3:
    <<: *api-service
    environment:
      - NODE_ENV=production
      - PORT=4000
      - INSTANCE_ID=api-3
      - IS_CRON_LEADER=false
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/speakright
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-speak-right-2026-super-secret-jwt-key}
      - FRONTEND_URL=${FRONTEND_URL:-https://tadat123.github.io/SpeakEnglishChallenge}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Speak Right Challenge 2026 <no-reply@speakright2026.com>}

  postgres:
    image: postgres:16-alpine
    container_name: speakright-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=speakright
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: postgres -c max_connections=500 -c shared_buffers=256MB
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: speakright-pgbouncer
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/speakright
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: speakright-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  apidata:
