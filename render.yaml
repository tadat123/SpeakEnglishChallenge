# Render.com Blueprint (1-Click Deploy cho Backend API + Database + Redis + Gmail SMTP)
services:
  - type: web
    name: speak-right-2026-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://tadat123.github.io/SpeakEnglishChallenge
      # Điền trên giao diện Render Environment để kích hoạt Database Postgres, Redis & Gmail SMTP thật:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Speak Right Challenge 2026 <no-reply@speakright2026.com>"
